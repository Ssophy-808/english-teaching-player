<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b59c3">
    <meta name="description" content="A simple, projection-friendly lesson player for English teachers.">
    <title>English Teaching Player</title>
    <link rel="stylesheet" href="css/style.css?v=13">
  </head>
  <body>
    <noscript>請啟用 JavaScript 才能使用教材播放器。</noscript>

    <main id="home-view" class="view" aria-labelledby="home-title">
      <header class="home-hero">
        <div>
          <p class="eyebrow">CLASSROOM TOOL</p>
          <h1 id="home-title">English Teaching Player</h1>
          <p class="hero-copy">Choose a lesson, then teach one clear step at a time.</p>
        </div>
        <button id="continue-button" class="button button-primary continue-button" type="button" hidden>
          <span>Continue Lesson</span>
          <small id="continue-label"></small>
        </button>
      </header>

      <section class="library" aria-labelledby="library-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LESSON LIBRARY</p>
            <h2 id="library-title">Choose a book</h2>
          </div>
          <p id="library-path" class="library-path" aria-live="polite"></p>
        </div>
        <div id="library-grid" class="library-grid"></div>
      </section>
    </main>

    <main id="player-view" class="player-view" hidden aria-label="Lesson player">
      <header class="player-header">
        <button id="home-button" class="icon-button" type="button" aria-label="Back to home" title="Back to home">⌂</button>
        <div class="lesson-identity">
          <p id="player-context"></p>
          <h1 id="lesson-name"></h1>
          <p id="phase-trail" class="phase-trail" aria-live="polite"></p>
        </div>
        <div class="player-tools">
          <button id="worksheet-button" class="flow-button worksheet-button" type="button" hidden>📝 講義</button>
          <button id="practice-jump-button" class="flow-button practice-jump-button" type="button" hidden>▶ 連續訓練</button>
          <button id="flow-button" class="flow-button" type="button" aria-haspopup="dialog">課程流程</button>
          <button id="toolbox-button" class="icon-button toolbox-button" type="button" aria-label="Open classroom toolbox" title="Classroom toolbox">★</button>
          <span id="step-count" class="step-count" aria-live="polite"></span>
          <button id="fullscreen-button" class="icon-button fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
        </div>
      </header>

      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <section id="step-stage" class="step-stage" tabindex="-1" aria-live="polite"></section>

      <footer class="player-controls">
        <button id="previous-button" class="nav-button nav-button-secondary" type="button">
          <span class="nav-arrow">←</span>
          <span><small>Previous</small><strong>上一頁</strong></span>
        </button>
        <p class="keyboard-hint">Use <kbd>←</kbd> <kbd>→</kbd> to navigate</p>
        <button id="next-button" class="nav-button nav-button-primary" type="button">
          <span><small>Next</small><strong>下一頁</strong></span>
          <span class="nav-arrow">→</span>
        </button>
      </footer>
    </main>

    <section id="flow-modal" class="flow-modal" hidden aria-label="課程流程" aria-modal="true" role="dialog">
      <div class="flow-shell">
        <header class="flow-header">
          <div>
            <p class="eyebrow">LESSON MAP</p>
            <h2>課程流程</h2>
            <p id="flow-summary" class="flow-summary"></p>
          </div>
          <button id="flow-close" class="icon-button" type="button" aria-label="關閉課程流程">×</button>
        </header>
        <div id="flow-groups" class="flow-groups"></div>
        <button id="flow-return" class="button button-primary flow-return" type="button">返回目前進度</button>
      </div>
    </section>

    <section id="worksheet-modal" class="worksheet-modal" hidden aria-label="Worksheet builder" aria-modal="true" role="dialog">
      <div class="worksheet-shell">
        <header class="worksheet-header no-print">
          <div><p class="eyebrow">PLAYER + WORKSHEET</p><h2 id="worksheet-title">講義產生器</h2></div>
          <button id="worksheet-close" class="icon-button" type="button" data-worksheet-close aria-label="Close worksheet">×</button>
        </header>
        <nav class="worksheet-toolbar no-print" aria-label="Worksheet controls">
          <button id="worksheet-student-mode" class="is-active" type="button">學生版 · 2 pages</button>
          <button id="worksheet-answer-mode" type="button">教師答案版</button>
          <button id="worksheet-shuffle" type="button" title="保留目前題目，只重新排列順序">🔀 只調整順序</button>
          <button id="worksheet-reset" type="button" title="恢復被刪除的全部題目，並回到原始順序">↻ 恢復全部題目</button>
          <button id="worksheet-print" class="worksheet-print" type="button">🖨 Print / Save PDF</button>
        </nav>
        <div id="worksheet-preview" class="worksheet-preview"></div>
      </div>
    </section>

    <section id="toolbox-modal" class="toolbox-modal" hidden aria-label="Classroom toolbox" aria-modal="true" role="dialog">
      <div class="toolbox-shell">
        <header class="toolbox-header">
          <div>
            <p class="eyebrow">NO-PREP CLASSROOM TOOLS</p>
            <h2>教室互動工具箱</h2>
          </div>
          <button id="toolbox-close" class="icon-button" type="button" aria-label="Close classroom toolbox">×</button>
        </header>
        <nav class="toolbox-tabs" aria-label="Choose a classroom tool">
          <button type="button" data-tool="random">🎴 Random</button>
          <button type="button" data-tool="reveal">🔲 Reveal</button>
          <button type="button" data-tool="memory">🧠 Matching</button>
          <button type="button" data-tool="dice">🎲 Dice</button>
          <button type="button" data-tool="timer">⏱ Timer</button>
          <button type="button" data-tool="score">🏆 Score</button>
        </nav>
        <div id="toolbox-stage" class="toolbox-stage" aria-live="polite"></div>
      </div>
    </section>

    <script src="data/book1.js?v=7" defer></script>
    <script src="data/book1-activities.js" defer></script>
    <script src="data/book1-passport.js?v=1" defer></script>
    <script src="data/book2.js?v=3" defer></script>
    <script src="data/book3.js?v=1" defer></script>
    <script src="data/book3-review.js?v=1" defer></script>
    <script src="js/teaching-flow.js?v=30" defer></script>
    <script src="js/activities.js?v=17" defer></script>
    <script src="js/worksheet.js?v=2" defer></script>
    <script src="js/classroom-tools.js?v=1" defer></script>
    <script src="js/player.js?v=5" defer></script>
    <script src="js/app.js?v=2" defer></script>
  </body>
</html>
